# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews pull requests on GitHub. Reference: https://docs.coderabbit.ai/reference/configuration
language: en-US

reviews:
  profile: chill
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  estimate_code_review_effort: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!package-lock.json"
    # Generated by `npm run codegen` from casino-be's schema; review the schema change instead.
    - "!src/gql/**"
  path_instructions:
    - path: "src/features/betting/**"
      instructions: |
        Odds, total odds, payout and cash-out maths must match casino-be (Bet::totalOdds, payoutFor, cashOutValue):
        whole cents, rounding half up. be is the authority; the slip only previews.
        Live match data comes from the Reverb-fed store (live-matches.tsx), not from refetching. My bets lists follow the
        betsVersion cache rules in src/stores/ui-store.ts: anything that changes a player's bets must bump it.
    - path: "src/app/**"
      instructions: |
        Next.js 16 with Cache Components, which differs from older versions: check node_modules/next/dist/docs before
        suggesting APIs. Pages that read the session or call be must not be prerendered with stale user data.
    - path: "src/lib/**"
      instructions: |
        The session token stays in the httpOnly cookie and on the server. The browser only calls the same-origin
        /api/graphql proxy. Mutations are Server Actions and validate input with Zod.
    - path: "src/stores/**"
      instructions: |
        One Zustand store per provider mount, never a module-level singleton shared between requests on the server.
    - path: "e2e/**"
      instructions: |
        Playwright tests avoid fixed sleeps and create their own data (registerNewPlayer, createLiveMatch). They must not
        depend on how many matches other tests leave on the page.
  tools:
    gitleaks:
      enabled: true
    # Our docs wrap at 120 columns and use wide tables, which the default markdownlint rules reject.
    markdownlint:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "ARCHITECTURE.md"
