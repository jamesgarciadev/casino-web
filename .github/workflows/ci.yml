name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Codegen, types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The be schema is the contract: regenerate from casino-be's main and fail if the committed types differ.
      - name: Generated GraphQL types match casino-be
        env:
          CODEGEN_SCHEMA: https://raw.githubusercontent.com/jamesgarciadev/casino-be/main/graphql/schema.public.graphql
        run: |
          npm run codegen
          git diff --exit-code -- src/gql || {
            echo "::error::src/gql doesn't match casino-be's main schema. Merge the be change first, or run npm run codegen."
            exit 1
          }

      - name: Types
        run: |
          npx next typegen
          npm run typecheck

      - run: npm run lint

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      # e2e/stack.ts expects casino-be next to this repo.
      - uses: actions/checkout@v5
        with:
          path: casino-web

      # Test against the casino-be branch of the same name when there is one (a change made in both repos),
      # otherwise against main.
      - name: Pick the casino-be branch
        id: be
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/jamesgarciadev/casino-be.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          repository: jamesgarciadev/casino-be
          ref: ${{ steps.be.outputs.ref }}
          path: casino-be

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_mysql, mbstring, intl, pcntl
          coverage: none

      - name: casino-be
        working-directory: casino-be
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate --no-interaction

      - uses: actions/setup-node@v5
        with:
          node-version-file: casino-web/.nvmrc
          cache: npm
          cache-dependency-path: casino-web/package-lock.json

      - name: Install
        working-directory: casino-web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # playwright.config.ts starts casino-be, Reverb and a production build of this app (CI mode: nothing reused).
      - name: Playwright (casino-be ${{ steps.be.outputs.ref }})
        working-directory: casino-web
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            casino-web/playwright-report
            casino-web/test-results
          retention-days: 7
